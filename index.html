<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101720" />
    <meta name="description" content="Uma pergunta certa pode mudar a conversa." />
    <title>Boa pergunta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="atmosphere" aria-hidden="true">
        <span class="orb orb--one"></span>
        <span class="orb orb--two"></span>
        <span class="orb orb--three"></span>
        <span class="grid"></span>
      </div>

      <section class="screen screen--home is-active" id="home-screen" aria-labelledby="home-title">
        <div class="brand">boa pergunta<span>.</span></div>
        <div class="home-content">
          <p class="eyebrow">Para conversas que ficam</p>
          <h1 id="home-title">Uma boa pergunta<br /><em>muda tudo.</em></h1>
          <p class="intro">Um convite simples para olhar com mais calma, ouvir mais fundo e descobrir algo novo.</p>
          <button class="primary-button" id="choose-question" type="button">
            <span>Escolher uma pergunta</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
          </button>
        </div>
        <p class="footnote">Respire. Não existe resposta certa.</p>
      </section>

      <section class="screen screen--question" id="question-screen" aria-live="polite" aria-labelledby="question-text" hidden>
        <div class="question-topline">
          <div class="brand">boa pergunta<span>.</span></div>
          <span class="question-label">Uma pausa para pensar</span>
        </div>
        <div class="question-content">
          <span class="quote-mark" aria-hidden="true">“</span>
          <p class="question" id="question-text"></p>
        </div>
        <button class="back-button" id="back-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M11 17l-5-5 5-5" /></svg>
          <span>Voltar</span>
        </button>
      </section>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
